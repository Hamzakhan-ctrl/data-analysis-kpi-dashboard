<!doctype html>
<html>

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 24px 24px}
.panel{background:white;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

</style>
</head>
